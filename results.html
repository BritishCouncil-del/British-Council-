<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>IELTS Results</title>
  <link rel="stylesheet" href="style.css">
  <!-- مكتبة jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="results">

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="welcome.html">🏠 الصفحة الرئيسية</a></li>
        <li><a href="#" onclick="downloadCertificate()">⬇️ تحميل النتائج PDF</a></li>
      </ul>
    </div>

    <!-- Results Box -->
    <div class="results-box watermark">
      <h2>IELTS Test Report Form</h2>
      <div class="trf-details">
        <p><strong>Candidate:</strong> HUSSEIN LUTFI HUSSEIN AL-SABBAGH</p>
        <p><strong>TRF Number:</strong> 26EG009265ALSH001A</p>
        <p><strong>Centre:</strong> EG001 - British Council</p>
      </div>

      <div class="results-content">
        <table class="results-table">
          <tr><td>Listening</td><td>8.5</td></tr>
          <tr><td>Reading</td><td>8.0</td></tr>
          <tr><td>Writing</td><td>7.5</td></tr>
          <tr><td>Speaking</td><td>8.0</td></tr>
          <tr>
            <td><strong>Overall Band Score</strong></td>
            <td class="score">8.0</td>
          </tr>
        </table>
        <img src="images/AL-SABBAGH.png" alt="Student Photo" class="student-photo">
      </div>

      <!-- Logos -->
      <div class="logo-section">
        <img src="images/british-council.png" alt="British Council">
        <img src="images/idp.png" alt="IDP">
        <img src="images/cambridge.png" alt="Cambridge English">
      </div>
      <div class="banner-section">
        <img src="images/ielts-banner.png" alt="IELTS Banner">
      </div>
    </div>
  </div>

  <!-- دالة تحميل الشهادة كـ PDF -->
  <script>
    function downloadCertificate(){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: "portrait",
        unit: "pt",
        format: "a4"
      });

      // تحميل صورة الشهادة من مجلد images
      const img = new Image();
      img.src = "images/AL-SABBAGH-certificate.jpg"; // اسم الصورة اللي رفعتها

      img.onload = function() {
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();

        // إدراج الصورة بالحجم الكامل داخل PDF
        doc.addImage(img, "JPEG", 0, 0, pageWidth, pageHeight);

        // حفظ الملف
        doc.save("IELTS_TRF_Certificate.pdf");
      };
    }
  </script>

</body>
</html>
